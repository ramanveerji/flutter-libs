name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version (e.g. 3.27.1)'
        required: false
        default: ''
        type: string
      dart_version:
        description: 'Dart SDK version (e.g. 3.5.4 or 3.10.8)'
        required: false
        default: ''
        type: string
      build_arm64:
        description: 'Build for arm64-v8a (64-bit ARM)'
        required: true
        type: boolean
        default: true
      build_armv7:
        description: 'Build for armeabi-v7a (32-bit ARM)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Flutter Version from Input
        id: resolve_version
        run: |
          if [ -z "${{ inputs.flutter_version }}" ] && [ -z "${{ inputs.dart_version }}" ]; then
            echo "Error: Please specify either a flutter_version OR a dart_version!"
            exit 1
          fi

          PYTHON_SCRIPT='
          import sys, urllib.request, json

          fl_in = sys.argv[1].strip()
          dart_in = sys.argv[2].strip()

          if fl_in:
              print(fl_in)
              sys.exit(0)

          if dart_in:
              url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = json.loads(urllib.request.urlopen(req).read())
                  # Check Dart SDK version (stable first)
                  for r in data["releases"]:
                      dart_ver = r.get("dart_sdk_version", "")
                      if r.get("channel") == "stable" and (dart_ver == dart_in or dart_ver.startswith(dart_in + " ") or dart_ver.startswith(dart_in + "-")):
                          print(r["version"])
                          sys.exit(0)
                  # Check Dart SDK version (any channel)
                  for r in data["releases"]:
                      dart_ver = r.get("dart_sdk_version", "")
                      if dart_ver == dart_in or dart_ver.startswith(dart_in + " ") or dart_ver.startswith(dart_in + "-"):
                          print(r["version"])
                          sys.exit(0)
              except Exception:
                  pass
              print(dart_in)
              sys.exit(0)
          '
          RESOLVED_VERSION=$(python3 -c "$PYTHON_SCRIPT" "${{ inputs.flutter_version }}" "${{ inputs.dart_version }}")
          echo "Resolved Flutter Version: $RESOLVED_VERSION"
          echo "flutter_version=$RESOLVED_VERSION" >> $GITHUB_OUTPUT

      - name: Check Existing Release
        id: check_release
        run: |
          TAG="flutter-v${{ steps.resolve_version.outputs.flutter_version }}"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          RELEASE_URL=$(echo "$RESPONSE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('html_url', ''))" 2>/dev/null)

          if [ -n "$RELEASE_URL" ] && [ "$RELEASE_URL" != "None" ]; then
            echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            
            echo "::notice ::Release for $TAG already exists at $RELEASE_URL"
            echo "## 🚀 Release Already Exists!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The requested Flutter library has already been built and published." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Click here to view/download the release]($RELEASE_URL)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Flutter
        if: steps.check_release.outputs.exists != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.resolve_version.outputs.flutter_version }}

      - name: Extract SDK Versions
        if: steps.check_release.outputs.exists != 'true'
        id: get_sdk_versions
        run: |
          FLUTTER_VER=$(flutter --version | head -n 1 | awk '{print $2}')
          DART_VER=$(dart --version 2>&1 | awk '{print $4}' | tr -d ',')
          echo "Flutter Version: $FLUTTER_VER"
          echo "Dart Version: $DART_VER"
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "dart_version=$DART_VER" >> $GITHUB_OUTPUT

      - name: Create Flutter project
        if: steps.check_release.outputs.exists != 'true'
        run: |
          flutter create flutter_so
          cd flutter_so
          flutter pub get

      - name: Build APK for target platforms
        if: steps.check_release.outputs.exists != 'true'
        run: |
          cd flutter_so
          TARGET_PLATFORMS=""
          if [ "${{ inputs.build_arm64 }}" = "true" ]; then
            TARGET_PLATFORMS="android-arm64"
          fi
          if [ "${{ inputs.build_armv7 }}" = "true" ]; then
            if [ -n "$TARGET_PLATFORMS" ]; then
              TARGET_PLATFORMS="$TARGET_PLATFORMS,android-arm"
            else
              TARGET_PLATFORMS="android-arm"
            fi
          fi

          if [ -z "$TARGET_PLATFORMS" ]; then
            echo "Error: Please select at least one architecture (arm64 or armv7)!"
            exit 1
          fi

          echo "Building APK for target platforms: $TARGET_PLATFORMS"
          flutter build apk --release --target-platform "$TARGET_PLATFORMS"

      - name: Extract & Zip Stripped Shared Libraries
        if: steps.check_release.outputs.exists != 'true'
        run: |
          mkdir -p output_libs
          APK_PATH="flutter_so/build/app/outputs/flutter-apk/app-release.apk"

          # Process arm64 if requested
          if [ "${{ inputs.build_arm64 }}" = "true" ]; then
            mkdir -p output_libs/arm64
            unzip -p "$APK_PATH" "lib/arm64-v8a/libflutter.so" > output_libs/arm64/libflutter.so
            (cd output_libs && zip -9 -r libflutter_so_arm64.zip arm64 && rm -rf arm64)
          fi

          # Process armv7 if requested
          if [ "${{ inputs.build_armv7 }}" = "true" ]; then
            mkdir -p output_libs/armv7
            unzip -p "$APK_PATH" "lib/armeabi-v7a/libflutter.so" > output_libs/armv7/libflutter.so
            (cd output_libs && zip -9 -r libflutter_so_armeabi_v7a.zip armv7 && rm -rf armv7)
          fi

      - name: Create GitHub Release & Upload Assets
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ steps.get_sdk_versions.outputs.flutter_version }}
          name: Flutter Release v${{ steps.get_sdk_versions.outputs.flutter_version }} (Dart v${{ steps.get_sdk_versions.outputs.dart_version }})
          body: |
            ## 📦 Flutter Native Shared Libraries (`libflutter.so`)

            | Component | Version |
            | --- | --- |
            | **Flutter SDK** | `${{ steps.get_sdk_versions.outputs.flutter_version }}` |
            | **Dart SDK** | `${{ steps.get_sdk_versions.outputs.dart_version }}` |

            ### Included Assets:
            ${{ inputs.build_arm64 && '- `libflutter_so_arm64.zip` (Contains `arm64/libflutter.so`)' || '' }}
            ${{ inputs.build_armv7 && '- `libflutter_so_armeabi_v7a.zip` (Contains `armv7/libflutter.so`)' || '' }}
          draft: false
          prerelease: false
          files: output_libs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
